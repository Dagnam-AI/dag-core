[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0", "BSD-3-Clause"]

# libFuzzer's bindings are licensed "(MIT OR Apache-2.0) AND NCSA" (the NCSA part is LLVM's
# libFuzzer sources). NCSA is OSI-approved and permissive. The crate is used only by the
# `publish = false` fuzz harness under `fuzz/`, which nothing ships, so the exception is for that
# crate alone rather than a licence allowed everywhere.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
