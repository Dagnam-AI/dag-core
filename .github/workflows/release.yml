name: Release dagnam-core to PyPI

# A release is the tag `core/vX.Y.Z` on a commit that is on `main` (RELEASE.md). Only a TAG push can
# check, attest or publish (a manual run of a tag ref cannot either). A pull request that changes
# any release input, or a manual run, builds every
# wheel and the sdist, installs each wheel on its own platform and runs tests/, and checks the file
# set: the rehearsal that RELEASE.md requires before the first tag and after any change here.
on:
  push:
    tags:
      - "core/v*"
  pull_request:
    # Every input of a release, so a change to one rehearses itself before it can reach a tag.
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build.yml"
      - ".github/scripts/release_dist.py"
      - ".github/scripts/build_stub_wheel.py"
      - ".github/ci-requirements.txt"
      - ".github/ci-build-requirements.txt"
      - "rust-toolchain.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
  workflow_dispatch:

# Guard against double-tag races. cancel-in-progress=false because once a build starts uploading
# to PyPI it must finish: PyPI rejects re-uploads of the same file, so a cancellation would leave
# a half-released state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is inherited: every job below states what it needs.
permissions: {}

env:
  UV_VERSION: "0.13.6" # keep equal to UV_VERSION in release-build.yml

jobs:
  check:
    name: Tag, version, changelog and CI agree
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestry check below needs main's history
          persist-credentials: false
      # `core/v1.2.3` is also a legal BRANCH name, so the ref's type is checked, not only its name.
      # These checks stop an accidental or careless tag; they do not stop a malicious ref, because
      # they are part of the tagged commit's own workflow file. That is what the tag ruleset and the
      # tag-only deployment rules of the `testpypi` and `pypi` environments are for (RELEASE.md).
      - name: Assert the ref is a tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::$GITHUB_REF is not a tag"
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) (ref $GITHUB_REF_NAME) is not an ancestor of origin/main; release only commits that are on main"
            exit 1
          fi
      - name: Assert the tag, pyproject.toml and CHANGELOG.md name one version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "core/v$version" ]; then
            echo "::error::the ref is $GITHUB_REF_NAME but pyproject.toml says version $version (want core/v$version)"
            exit 1
          fi
          if ! grep -Eq "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' heading"
            exit 1
          fi
      # PyPI takes no version back, so a tag publishes only a commit whose own CI (the `gate` job
      # of ci.yml, run when it landed on main) is green, as reported by GitHub Actions itself.
      # `in_progress/null` means CI is still running: re-run this workflow once it is green.
      - name: Assert CI is green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=gate&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | first | if . == null then "missing" else "\(.status)/\(.conclusion)" end')
          if [ "$state" != completed/success ]; then
            echo "::error::the gate job of CI on $sha is '$state' (want completed/success)"
            exit 1
          fi

  # Every wheel and the sdist are built, and each wheel installed and tested on its own platform,
  # by the reusable workflow below. It is a separate file only to keep this one under the 500-line
  # cap: everything the trusted publisher binds (the publish jobs, the environments) stays here.
  build-test:
    name: Build and test every wheel, the sdist and the stub
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml

  # The release is exactly the 16 files below and nothing else: every other artifact of this
  # run (a stray one from a build or test job) fails here, and attest and publish take only the
  # re-uploaded `release-dist`. A rogue `release-dist` made earlier fails the upload.
  collect:
    name: Collect and check the release files
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: stage/
      - name: Assert exactly the expected artifacts and files
        run: python3 .github/scripts/release_dist.py verify stage release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: release-dist/
          if-no-files-found: error

  # Attests exactly the files `collect` checked, in a job that runs nothing but the two pinned
  # actions below, so no build tool can reach its OIDC token.
  attest:
    name: Attest build provenance
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [check, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dagnam-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run after a later job failed must not die on the files already uploaded; the
          # smoke job compares every file's digest, so a skipped file cannot pass unnoticed.
          skip-existing: true

  smoke-testpypi:
    name: Install from TestPyPI and run it
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # The digest comparison waits up to 15 minutes for TestPyPI's index.
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # TestPyPI must serve exactly the files built in THIS run, byte for byte: the upload skips
      # a file that is already there, so this is what proves the smoke test runs our bytes.
      - name: Compare TestPyPI's files with this run's
        run: python3 .github/scripts/release_dist.py compare dist
      # One try: the comparison above already waited for TestPyPI to list the files. If the simple
      # index still lags (a separate path), this fails closed and the job is re-run.
      - name: Install from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#core/v}"
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          # No dependencies, so nothing is taken from the real index: a squatted higher version
          # of the name there could otherwise win a tie against this one.
          uv pip install --python "$RUNNER_TEMP/smoke" --no-deps --refresh \
            --index-url https://test.pypi.org/simple/ "dagnam-core==$version"
      # On a supported platform the install above must give the NATIVE wheel, not the stub: the
      # import below raises ImportError on the stub, and CORE_API and UNICODE_SUPPORTED are the
      # compiled module's.
      - name: Run what was installed
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -c '
          import sys
          import dagnam_core
          from dagnam_core import hygiene
          assert dagnam_core.__version__ == sys.argv[1], dagnam_core.__version__
          assert hygiene.CORE_API == 2
          assert hygiene.UNICODE_SUPPORTED
          assert hygiene.findings("mail a@b.co now") == [(5, 11, "PII_EMAIL")]
          ' "${GITHUB_REF_NAME#core/v}"

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dagnam-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Twine uploads file by file, so a failure can leave some files on PyPI; a re-run must
          # finish the rest. PyPI never lets a file name be reused, so a skipped file is the one
          # already accepted.
          skip-existing: true
