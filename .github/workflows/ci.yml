name: dag-core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scripts/check.sh diffs against origin/main for mutation testing
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install the cargo tools
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-mutants@27.1.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Run the gate
        run: scripts/check.sh

  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build the wheel
        run: |
          uv venv --python 3.12
          uv pip install "maturin>=1.13,<2" "pytest>=9,<10"
          uv run --no-project maturin build --locked --release --out target/wheels
      - name: Test the built wheel
        run: |
          uv pip install --force-reinstall target/wheels/dagnam_core-*.whl
          uv run --no-project python -m pytest -q tests
