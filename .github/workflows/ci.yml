name: dag-core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scripts/check.sh diffs against origin/main for mutation testing
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install the cargo tools
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-mutants@27.1.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Run the gate
        run: scripts/check.sh

  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build the wheel
        run: |
          uv venv --python 3.12
          uv pip install "maturin>=1.13,<2" "pytest>=9,<10"
          uv run --no-project maturin build --locked --release --out target/wheels
      - name: Test the built wheel
        run: |
          uv pip install --force-reinstall target/wheels/dagnam_core-*.whl
          DAGNAM_EXPECT_UNICODE=15.0.0 uv run --no-project python -m pytest -q tests
          uv run --no-project python scripts/gen_py_classes.py --check
      # The character classes follow the interpreter's Unicode (3.12: 15.0.0, 3.13: 15.1.0, 3.14:
      # 16.0.0), and tests/test_unicode_tables.py checks every code point against `re`, so each
      # leg proves its own table, and DAGNAM_EXPECT_UNICODE fails a leg that runs another
      # interpreter. `gen_py_classes.py --check` verifies the table file and corpus line of each.
      # 3.14t shares 16.0.0 and is tested by the release workflow.
      - name: Test the built wheel on CPython 3.13 and 3.14
        run: |
          for leg in 3.13:15.1.0 3.14:16.0.0; do
            py=${leg%%:*}
            DAGNAM_EXPECT_UNICODE=${leg##*:} uv run --no-project --python "$py" \
              --with "pytest>=9,<10" --with target/wheels/dagnam_core-*.whl \
              python -m pytest -q tests
            uv run --no-project --python "$py" python scripts/gen_py_classes.py --check
          done

  # The release workflow's file checks (what a release may hold) run on every pull request, not
  # only when a release input changes; stdlib only, so nothing is installed.
  release-script:
    name: release file checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -v
