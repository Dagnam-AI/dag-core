[package]
name = "dagnam-hygiene"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake2 = "0.11.0"
# Only what the detector patterns need: Unicode case folding for `(?i)` and the fast paths.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
