[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Dagnam-AI/dag-core"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"

# No `panic = "abort"`: PyO3 must unwind so a Rust panic becomes a catchable Python
# `PanicException` instead of killing the interpreter.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
